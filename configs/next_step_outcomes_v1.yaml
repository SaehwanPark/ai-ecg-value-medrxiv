# A6 post-ECG next-step evaluation outcomes (decision D12, proxy clinical decision under D11).
# Plan: docs/plan_20261005_a6a7/a6-next-step-evaluation-plan.md
#
# The sha256 of this file's text is the freeze. The locked-test command refuses to run when the
# hash differs from FROZEN_CONFIG_HASH in src/ecg_rep/next_step.py, which is recorded after the
# development-only feasibility gate. Do not edit this file after the freeze; a revision by the
# clinical reviewer is a new file (next_step_outcomes_v2.yaml) run next to this one.
version: next-step-outcomes-v1
status: frozen_after_feasibility
decision: D12
anchor: index_ecg_time
window_convention: "(t0, t0 + window]; half-open, strictly after the tracing"
settings_in_scope: [ED, inpatient_non_ICU, other_or_unlinked]
icu_policy: excluded_counted_only
ambiguous_policy: excluded
action_timestamps:
  lab: charttime
  poe: ordertime
  ecg: record_list.ecg_time
  admission: admittime
  icu: icustays.intime
reacquisition_gap_minutes: 10
lab_naive_lookback_hours: 24
prior_troponin_lookback_hours: 6
feasibility_gates:
  min_eligible_n: 500
  min_prevalence: 0.01
  max_prevalence: 0.97
  min_poe_coverage_of_admitted: 0.80
  min_nonadmitted_ed_n: 500
lab_items:
  basic:
    creatinine: [50912]
    potassium: [50971]
    hemoglobin: [51222]
    wbc: [51301]
  troponin_t: [51003]
  troponin_i: [51002, 52642]
poe_cardiac_orders:
  transaction_type: New
  order_types:
    Cardiology: ["Echo", "Echo - Surface", "Stress Echo", "ETT (Non-Imaging)", "Holter Monitor"]
    Consults: ["Cardiology (General)", "Cardiology (EP)"]
outcomes:
  - id: N1
    name: basic_labs_drawn
    window_hours: 24
    settings: [ED, inpatient_non_ICU, other_or_unlinked]
    source: labs_basic
    primary_population: lab_naive_at_t0
  - id: N2
    name: troponin_drawn
    window_hours: 12
    settings: [ED, inpatient_non_ICU, other_or_unlinked]
    source: labs_troponin
    stratify_by: troponin_in_prior_6h
  - id: N3
    name: repeat_12_lead_ecg
    window_hours: 24
    settings: [ED, inpatient_non_ICU, other_or_unlinked]
    source: record_list
    min_gap_minutes: 10
  - id: N4
    name: admission_from_ed
    window_hours: 24
    settings: [ED]
    source: ed_interval_admission
  - id: N4u
    name: acute_care_contact
    window_hours: 168
    settings: [other_or_unlinked]
    source: ed_arrival_or_admission
  - id: N5
    name: icu_escalation
    window_hours: 48
    settings: [ED, inpatient_non_ICU]
    source: icu_intime
  - id: N6
    name: cardiac_workup_order
    window_hours: 72
    settings: [ED, inpatient_non_ICU, other_or_unlinked]
    source: poe_cardiac
    eligibility: admission_covering_or_starting_within_24h
# Development-only feasibility (docs/clinical_extensions/next_step_feasibility.md) found every primary
# outcome by setting cell inside the gates, so nothing is dropped. Frozen 2026-10-05 before any
# locked-test join.
dropped_cells: []

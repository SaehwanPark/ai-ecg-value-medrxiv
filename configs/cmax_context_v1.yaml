  ptt_blood: {itemids: [51275, 52923], unit: sec, low: 12.0, high: 240.0}
  ast_blood: {itemids: [50878], unit: iu/l, low: 2.0, high: 20000.0}
  alt_blood: {itemids: [50861, 53084], unit: iu/l, low: 2.0, high: 20000.0}
  alp_blood: {itemids: [50863, 53086], unit: iu/l, low: 5.0, high: 20000.0}
  bilirubin_total_blood: {itemids: [50885, 53089], unit: mg/dl, low: 0.1, high: 60.0}
  albumin_blood: {itemids: [50862, 53085], unit: g/dl, low: 0.5, high: 7.0}

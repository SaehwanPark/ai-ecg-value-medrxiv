[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ecg-value-medrxiv"
version = "0.1.0"
description = "Replication package (analysis pipeline + aggregate displays) for the AI-ECG incremental-value medRxiv preprint"
requires-python = ">=3.13"
dependencies = [
  "h5py>=3.16.0",
  "huggingface-hub>=1.28.0",
  "matplotlib>=3.11.1",
  "numpy>=2.5.3",
  "polars>=1.44.1",
  "pyarrow>=25.0.1",
  "pyyaml>=6.0.3",
  "scikit-learn>=1.9.0",
  "scipy>=1.18.1",
  "setuptools>=84.0.0",
  "torch>=2.13.0",
  "transformers>=5.15.1",
  "wfdb>=4.3.1",
]

[project.scripts]
ecg-rep = "ecg_rep.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_ecg_value", "src/ecg_rep"]
